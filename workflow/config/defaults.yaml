
alphafold3:
  # https://hub.docker.com/r/jurgjn/alphafold3
  #container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_v3.0.2.sif
  #container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_b78e215.sif
  #container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_2e2ffc1.sif
  #container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_0422023.sif
  container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_v3.0.1.sif
  #container: /cluster/project/beltrao/shared/alphafold3/images/alphafold3_v3.0.0.sif
  db_dir: /cluster/project/alphafold/alphafold3
  # AlphaFold 3 default cutoff - https://github.com/google-deepmind/alphafold3/blob/v3.0.2/run_alphafold.py#L273
  max_template_date: '2021-09-30'
  # Turn off templates - https://pdb101.rcsb.org/motm/142
  #max_template_date: 1970-01-01
  # Default location for model weights
  model_dir: ~/.alphafold3_model_dir
  fetch_databases_url: https://raw.githubusercontent.com/google-deepmind/alphafold3/refs/tags/v3.0.1/fetch_databases.sh
  # https://alphafold.ebi.ac.uk/faq
  # > The minimum length is 16 amino acids
  predictions_multigpu_tokens_min: 16
  # ValueError: Number of tokens 5649 is more than the largest currently supported bucket size 5120.
  predictions_multigpu_tokens_max: 5120
  predictions_multigpu_runtime: 4h
  predictions_multigpu_buffer_time: 0.8
  msas:
    threads: 4 # Reduced from 8 (default) to 4, increases CPU utilization from 30-50 to 90%
    retries: 3 # https://snakemake.readthedocs.io/en/stable/snakefiles/rules.html#defining-retries-for-fallible-rules
  predictions:
    # Extra arguments to singularity, e.g. set environmental variables to enable unified memory or jax cache
    singularity_args: ''
    # Extra arguments to DeepMind's run_alphafold.py script, e.g. number of recycles
    run_alphafold_args: ''
    # Wrapper script (under workflow/scripts) to tweak shard spec for low-memory GPUs
    run_alphafold_wrapper: run_alphafold_shard_default.sh
    # Safe resource defaults, A100 with plenty of RAM
    retries: 0
    runtime: 4h
    mem_mb: 98304
    disk_mb: 16384
    slurm_extra: '--gpus=a100:1'
  # alphafold3_datafill_predictions_batched (workflow/targets/): N pools per GPU job, packed by predicted runtime.
  # The table below is Anthropic's af3_torch kit (mode big) on the RTX PRO 6000, warm, N pools per process:
  # 1600/3000 measured, 3500-4500 from single-call forward times + writing (UNVERIFIED as multi-pool; the
  # BATCH_EST_MIN vs CONTAINER_START/END lines of the job logs calibrate it). Set per run for other engines/cards.
  predictions_batched:
    runtime: 4h
    budget_hrs: 2.8
    job_overhead_s: 180
    max_pools_per_job: 40
    tokens_min: 16
    tokens_max: 4500
    order: tokens_desc
    runtime_table_s: [[1600, 90], [3000, 110], [3500, 200], [4000, 260], [4500, 330]]
    disk_mb_per_pool: 2048
    disk_mb_min: 16384
    # sbatch --ntasks of a batch job (mem_mb split over them): the kit's featurise / write-behind processes + the early zipper
    threads: 4
    # a pool is zipped beside the running container once its <id>_ranking_scores.csv is this old (seconds)
    zip_settle_s: 30
    # false: no zipping beside the container (the rule of the first batched runs); a control switch
    early_zip: true
  summary_ipsae:
    pae_cutoff: 10
    dist_cutoff: 10

# https://docs.hpc.ethz.ch/software/software-stack/#spack
# latest is stack/2025-06; match with batch-infer & software/venv/create
envmodules:
- stack/2025-06
- python/3.13.0
- eth_proxy

envmodules_offline:
- stack/2025-06
- python/3.13.0

singularity:
  container_dir: /cluster/project/beltrao/shared/alphafold3/images/
